site_name: ChronicleMCP
repo_url: https://github.com/nikolasil/chronicle-mcp
edit_uri: edit/main/docs/
canonical_url: https://nikolasil.github.io/chronicle-mcp/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.trimming
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang:
        - en
  - mdxinclude:
      enabled: false
  - social:
      enabled: true
      cards: true

nav:
  - Home: index.md
  - Installation:
      - Install: INSTALL.md
      - Browser Support: BROWSER_SUPPORT.md
  - User Guide: USER_GUIDE.md
  - CLI Reference: CLI.md
  - HTTP API:
      - Overview: API_INDEX.md
      - Endpoints: API_ENDPOINTS.md
      - Examples: API_EXAMPLES.md
  - Advanced Search: ADVANCED_SEARCH.md
  - Analytics: ANALYTICS.md
  - Architecture: ARCHITECTURE.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Security: SECURITY_HARDENING.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nikolasil/chronicle-mcp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/chronicle-mcp

extra_css:
  - stylesheets/extra.css

watch:
  - chronicle_mcp
  - docs
